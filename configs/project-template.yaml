project:
  name: "My Writing Project"
  language: "zh-CN"
  genre: "fantasy"
  sourceOfTruth:
    - "canon/"
  draftDirs:
    - "chapters/"
    - "fragments/"

writing:
  defaultMode: "plan_then_write"
  allowNewCanonWithoutConfirmation: false
  allowMajorPlotChangeWithoutConfirmation: false

style:
  proseProfile: "custom"
  descriptionDensity: "medium"
  dialogueStyle: "restrained"
  pov: "third_limited"
  taboo:
    - "不要口号化"
    - "不要替角色总结情绪"

memory:
  canonStates:
    - idea
    - candidate
    - canon
    - deprecated
  requireConfirmationForCanon: true

retrieval:
  exactMatchWeight: 0.5
  vectorWeight: 0.3
  recencyWeight: 0.2
  deprecatedPenalty: 0.8

cache:
  enabled: true
  strategy: "aggressive"
  stablePrefix: true
  appendOnlyWorkflowLog: true
  maxCanonEntries: 32
  maxDraftEntries: 8
  maxCanonEntryChars: 4000
  maxDraftEntryChars: 12000
  maxWorkflowLogEntries: 12
  maxResultChars: 1800
  maxTotalContextChars: 120000

models:
  # The TUI model picker only changes lead agents. Most helper agents stay fast by default.
  main_agent: "deepseek-chat"
  subagent_default: "deepseek-v4-flash"
  # Optional advanced overrides:
  # prose_writer: "deepseek-v4-pro"
  # critic: "deepseek-chat"
  # continuity_checker: "deepseek-v4-flash"
