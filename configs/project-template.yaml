project:
  name: "My Writing Project"
  language: "zh-CN"
  genre: "fantasy"

writing:
  defaultMode: "plan_then_write"
  allowNewCanonWithoutConfirmation: false
  allowMajorPlotChangeWithoutConfirmation: false

style:
  proseProfile: "custom"
  descriptionDensity: "medium"
  dialogueStyle: "restrained"
  pov: "third_limited"
  taboo:
    - "不要口号化"
    - "不要替角色总结情绪"

memory:
  canonStates:
    - idea
    - candidate
    - canon
    - deprecated
  requireConfirmationForCanon: true

retrieval:
  exactMatchWeight: 0.5
  vectorWeight: 0.3
  recencyWeight: 0.2
  deprecatedPenalty: 0.8

cache:
  enabled: true
  strategy: "aggressive"
  stablePrefix: true
  maxCanonEntries: 32
  maxDraftEntries: 8
  maxCanonEntryChars: 4000
  maxDraftEntryChars: 12000
  maxTotalContextChars: 120000

models:
  # Optional advanced provider-specific overrides.
  # Leave empty to use the provider selected in /config.
  # main_agent: "your-main-model"
  # subagent_default: "your-fast-model"
  # prose_writer: "your-prose-model"
  # critic: "your-review-model"
  # continuity_checker: "your-fast-review-model"
